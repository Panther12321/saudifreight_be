name: naqil-backend

x-naqil-environment: &naqil-environment
    SITE_NAME: ${SITE_NAME:-naqil.localhost}
    SITE_DB_NAME: ${SITE_DB_NAME:-naqil}
    SITE_DB_PASSWORD: ${SITE_DB_PASSWORD:?set SITE_DB_PASSWORD in .env}
    DB_HOST: mariadb
    DB_PORT: 3306
    DB_ROOT_USER: root
    DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    FRAPPE_ENCRYPTION_KEY: ${FRAPPE_ENCRYPTION_KEY:?set FRAPPE_ENCRYPTION_KEY in .env}
    REDIS_CACHE: redis://redis-cache:6379
    REDIS_QUEUE: redis://redis-queue:6379
    REDIS_SOCKETIO: redis://redis-socketio:6379

x-naqil-image: &naqil-image
  build:
    context: .
  image: naqil-backend:local
  environment: *naqil-environment
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
  redis-queue:
    image: redis:7-alpine
  redis-socketio:
    image: redis:7-alpine

  backend:
    <<: *naqil-image
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
      - redis-socketio
    environment:
      <<: *naqil-environment
      NAQIL_SERVICE: web

  websocket:
    <<: *naqil-image
    depends_on:
      - redis-socketio
    environment:
      <<: *naqil-environment
      NAQIL_SERVICE: websocket

  worker-short:
    <<: *naqil-image
    depends_on:
      - redis-queue
    environment:
      <<: *naqil-environment
      NAQIL_SERVICE: worker-short

  worker-long:
    <<: *naqil-image
    depends_on:
      - redis-queue
    environment:
      <<: *naqil-environment
      NAQIL_SERVICE: worker-long

  scheduler:
    <<: *naqil-image
    depends_on:
      - redis-queue
    environment:
      <<: *naqil-environment
      NAQIL_SERVICE: scheduler

  migrate:
    <<: *naqil-image
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    environment:
      <<: *naqil-environment
      NAQIL_SERVICE: migrate
    restart: "no"

volumes:
  sites:
  mariadb-data:
